<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="780" viewBox="0 0 520 780" role="img" aria-label="Cover image placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#efe9dc"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8552b"/>
      <stop offset="1" stop-color="#7d3d1f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="520" height="780" rx="6" ry="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="780" fill="url(#spine)"/>
  <rect x="34" y="34" width="452" height="712" rx="4" ry="4"
        fill="none" stroke="#a8552b" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- image glyph -->
  <g transform="translate(260 300)" fill="none" stroke="#a8552b" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="-70" y="-58" width="140" height="116" rx="10" ry="10"/>
    <circle cx="-30" cy="-22" r="14"/>
    <path d="M-70 36 L-26 -8 L8 26 L34 2 L70 40"/>
  </g>

  <text x="260" y="470" text-anchor="middle"
        font-family="'Noto Serif Kannada','EB Garamond',Georgia,serif"
        font-size="34" font-weight="600" fill="#23201c">ಕವರ್ ಚಿತ್ರ</text>
  <text x="260" y="508" text-anchor="middle"
        font-family="'Inter','Noto Sans Kannada',sans-serif"
        font-size="16" letter-spacing="3" fill="#5b544a">COVER IMAGE</text>

  <text x="260" y="600" text-anchor="middle"
        font-family="'Inter','Noto Sans Kannada',sans-serif"
        font-size="13" fill="#5b544a">ನಿಮ್ಮ ಚಿತ್ರವನ್ನು ಇಲ್ಲಿ ಇರಿಸಿ</text>
  <text x="260" y="624" text-anchor="middle"
        font-family="'Inter','Noto Sans Kannada',sans-serif"
        font-size="13" fill="#5b544a">Replace this file with your image</text>

  <text x="260" y="690" text-anchor="middle"
        font-family="'Inter','Noto Sans Kannada',sans-serif"
        font-size="11" letter-spacing="1" fill="#8d8478">assets/img/cover-placeholder.svg</text>
</svg>
